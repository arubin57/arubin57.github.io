<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Интерактивные материалы</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:linear-gradient(145deg,#f5faff,#ffffff);display:flex;justify-content:center;align-items:center;padding:24px}
.wrap{width:min(900px,100%);text-align:center}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#4879ab;font-weight:700;margin-bottom:12px}
h1{font-size:clamp(34px,5.5vw,58px);margin:0 0 12px}
p{font-size:clamp(17px,2.2vw,22px);color:#64748b;margin:0 0 34px;line-height:1.5}
.card{display:block;text-decoration:none;color:inherit;background:white;border:2px solid #dce8f5;border-radius:24px;padding:36px 28px;box-shadow:0 10px 34px #18395c16;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 16px 38px #18395c24}
.icon{font-size:46px;line-height:1.2;margin-bottom:10px}
.title{font-size:clamp(28px,3.4vw,38px);font-weight:800}
.desc{font-size:18px;color:#64748b;margin-top:9px}
footer{position:fixed;right:14px;bottom:12px;font-size:12px;color:#9baabe}
</style>
</head>
<body>
<main class="wrap">
<div class="eyebrow">Интерактивные материалы</div>
<h1>Добро пожаловать!</h1>
<p>Игры и учебные задания для занятий на интерактивной панели.</p>
<a class="card" href="/maths/"><div class="icon" aria-hidden="true">✦</div><div class="title">Математика</div><div class="desc">Интерактивные игры и задания для уроков</div></a>
</main>
<footer>© Алексей Рубин</footer>
</body>
</html>
