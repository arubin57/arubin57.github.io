<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5ead5">
<title>Владимир Даль — квиз и предсказания</title>
<style>
:root {
  color-scheme: light;
  --ink: #242d38;
  --paper: #f5ead5;
  --gold: #b48743;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: radial-gradient(ellipse at 30% 0%, #fffaf0, transparent 54%), var(--paper);
  font: 1rem/1.5 system-ui, sans-serif;
}
main { width: min(100% - 48px, 1000px); margin: 0 auto; padding: 48px 0 24px; }
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(180px, .65fr);
  align-items: center;
  gap: clamp(28px, 6vw, 88px);
  min-height: 340px;
  padding: 28px clamp(28px, 5vw, 64px);
  border-block: 1px solid #b4874370;
}
h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 700; }
h1 { margin: 0; font-size: clamp(50px, 8vw, 104px); line-height: .98; letter-spacing: -.045em; }
.years { margin: 20px 0 0; color: #785925; font: 1.125rem Georgia, serif; letter-spacing: .12em; }
.lead { margin: 15px 0 0; color: #514b43; font-size: clamp(1rem, 2.3vw, 1.2rem); }
.portrait {
  width: min(100%, 240px);
  aspect-ratio: 1 / 1.2;
  justify-self: center;
  overflow: hidden;
  border: 4px solid #f7f0e2;
  border-radius: 49% 49% 5px 5px;
  outline: 1px solid var(--gold);
  box-shadow: 0 10px 26px #4f381b30;
  background: #deceb4;
}
.portrait img { display: block; width: 100%; height: auto; }
.activities { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 25px 0 0; }
.card {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 220px;
  padding: 27px;
  overflow: hidden;
  border: 1px solid #bd9a5c;
  border-radius: 16px;
  background: var(--card-color);
  color: #fff8ea;
  box-shadow: 0 6px 16px #4e391c20;
  text-decoration: none;
  transition: transform .18s ease, box-shadow .18s ease;
}
.quiz { --card-color: #102748; }
.prediction { --card-color: #542817; }
.art, .card::after { position: absolute; inset: 0 0 0 auto; width: 58%; height: 100%; z-index: -1; }
.art { overflow: hidden; }
.art img { position: absolute; top: -12%; left: 0; width: auto; height: 170%; }
.card::after { content: ""; background: linear-gradient(90deg, var(--card-color), transparent 90%); }
.card h2 { margin: 0; font-size: clamp(29px, 4vw, 42px); line-height: 1.1; }
.card p { margin: 10px 0 18px; max-width: 15ch; color: #fff3dd; }
.card .action { width: fit-content; padding: 7px 13px; border: 1px solid #dfbe83; border-radius: 6px; color: #fff3dd; background: var(--card-color); font-weight: 650; }
.card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px #4e391c35; }
.card:focus-visible { outline: 3px solid #3e6197; outline-offset: 4px; }
footer { padding: 24px 0 0; text-align: center; color: #6b5c46; font-size: .83rem; }
@media (max-width: 660px) {
  main { width: min(100% - 32px, 460px); padding-top: 22px; }
  .hero { grid-template-columns: 1fr auto; gap: 16px; min-height: 0; padding: 19px 4px; }
  h1 { font-size: clamp(33px, 10vw, 56px); }
  .years { margin-top: 10px; font-size: .9rem; }
  .lead { margin-top: 8px; font-size: .93rem; }
  .portrait { width: clamp(82px, 25vw, 130px); }
  .activities { grid-template-columns: 1fr; gap: 13px; margin-top: 18px; }
  .card { min-height: 174px; padding: 18px; }
  .card p { margin-bottom: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div>
      <h1>Владимир<br>Даль</h1>
      <p class="years">1801–1872</p>
      <p class="lead">Квиз и предсказания со старинными словами</p>
    </div>
    <div class="portrait">
      <img src="dal-portrait.jpg" width="667" height="1000" alt="Портрет Владимира Ивановича Даля">
    </div>
  </header>
  <nav class="activities" aria-label="Квиз и предсказания">
    <a class="card quiz" href="/dal-quiz/">
      <span class="art" aria-hidden="true"><img src="quiz-art.jpg" width="1600" height="900" alt=""></span>
      <div><h2>Квиз</h2><p>Шесть туров о жизни и сказках Даля</p></div>
      <span class="action" aria-hidden="true">Играть →</span>
    </a>
    <a class="card prediction" href="/volshebny-slovar/">
      <span class="art" aria-hidden="true"><img src="prediction-art.jpg" width="1600" height="900" alt=""></span>
      <div><h2>Предсказания</h2><p>Вытяни послание и разгадай старинные слова</p></div>
      <span class="action" aria-hidden="true">Вытянуть →</span>
    </a>
  </nav>
  <footer>© Алексей Рубин</footer>
</main>
</body>
</html>
